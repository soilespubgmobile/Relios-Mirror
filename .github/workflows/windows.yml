name: Windows exe

on:
  push:
  workflow_dispatch:

# (the build only reads the repository; only the "release" job at the end may write to it)
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false # (nothing below needs the token; it is not left in the folder)
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_ttf
      # The virtual camera ("Relios Mirror Camera"): softcam (MIT), one fixed revision whose source was read before
      # it was added here. It gets this camera's own name and class id, and needs no runtime DLLs.
      - name: Build the virtual camera (softcam, a fixed revision)
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $rev = 'd1acde4617782f87a3929d7a7528fa3e524ec56b'
          git init -q softcam
          git -C softcam remote add origin https://github.com/tshino/softcam.git
          git -C softcam fetch -q --depth 1 origin $rev
          git -C softcam checkout -q FETCH_HEAD
          if ((git -C softcam rev-parse HEAD) -ne $rev) { throw 'softcam: not the expected revision' }
          $changed = 0
          foreach ($file in (Get-ChildItem softcam/src/softcam, softcam/src/softcamcore -Include *.cpp, *.h -Recurse)) {
            $text = [IO.File]::ReadAllText($file.FullName)
            $new = $text.Replace('DirectShow Softcam', 'Relios Mirror Camera')
            $new = $new.Replace('0xaef3b972, 0x5fa5, 0x4647, 0x95, 0x71, 0x35, 0x8e, 0xb4, 0x72, 0xbc, 0x9e', '0xa50eb610, 0xeeb2, 0x4c26, 0xa2, 0xe9, 0xb5, 0xd0, 0x0e, 0x01, 0xec, 0x2d')
            if ($new -cne $text) { [IO.File]::WriteAllText($file.FullName, $new); $changed++; Write-Host "changed: $($file.Name)" }
          }
          if ($changed -lt 3) { throw 'softcam: the name was not found where it is expected' }
          if (-not (Select-String -Path softcam/src/softcam/softcam.cpp -Pattern '0xa50eb610' -Quiet)) { throw 'softcam: the class id was not replaced' }
          # one C runtime, inside the DLL (the project also names the runtime DLL's library: taken out)
          $proj = 'softcam/src/softcam/softcam.vcxproj'
          $text = [IO.File]::ReadAllText($proj)
          if (-not $text.Contains('msvcrt.lib;')) { throw 'softcam: the project file is not as expected' }
          [IO.File]::WriteAllText($proj, $text.Replace('msvcrt.lib;', ''))
          Set-Content softcam/Directory.Build.targets '<Project><ItemDefinitionGroup Condition="''$(Configuration)''==''Release''"><ClCompile><RuntimeLibrary>MultiThreaded</RuntimeLibrary></ClCompile></ItemDefinitionGroup></Project>'
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          $root = (Resolve-Path softcam).Path + '\\'
          & $msbuild softcam\src\softcam\softcam.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=$root /m /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { throw 'softcam: the build failed' }
          Get-ChildItem softcam\dist -Recurse -Filter softcam.dll | ForEach-Object { Write-Host "built: $($_.FullName) ($($_.Length) bytes)" }
      # The USB protocol of wired mirroring, tested with messages captured from real devices (tests/fixtures/qvh).
      - name: Test the USB protocol
        run: |
          gcc -std=c11 -O1 -Wall -Wextra -Iviewer tests/qtproto_test.c viewer/qtproto.c -o qtproto_test.exe
          ./qtproto_test.exe tests/fixtures/qvh
      # The USB driver for wired mirroring: libusb-win32 1.2.6.0, its official release on SourceForge. The two files
      # the program installs must have these SHA-256 fingerprints (the program checks the same ones again before it
      # installs them), or the build stops. Nothing downloaded here is run.
      - name: Fetch the USB driver (libusb-win32 1.2.6.0, fixed fingerprints)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://downloads.sourceforge.net/project/libusb-win32/libusb-win32-releases/1.2.6.0'
          New-Item -ItemType Directory -Force libusb-dl, libusb-dl/bin, usb, dist-usb-kaynak | Out-Null
          foreach ($name in 'libusb-win32-bin-1.2.6.0.zip', 'libusb-win32-src-1.2.6.0.zip') {
            & curl.exe -fsSL --retry 6 --retry-delay 10 --retry-all-errors -A 'Wget/1.21' -o "libusb-dl/$name" "$base/$name"
            if ($LASTEXITCODE -ne 0) { throw "libusb-win32: $name could not be downloaded" }
            Write-Host "$name : $((Get-FileHash "libusb-dl/$name" -Algorithm SHA256).Hash)"
          }
          Expand-Archive libusb-dl/libusb-win32-bin-1.2.6.0.zip -DestinationPath libusb-dl/bin
          $expected = @{
            'libusb0.sys' = '8058F2AFE6EF96A7D2DED432997FD8655970C9EA75A938EE4557D6A2CB4CC989'
            'libusb0.dll' = '4F18B5D2C28AA66B648C8683C6D09B52B92CBBEE85984BBEFAD5F38A64BC2A14'
          }
          foreach ($file in $expected.Keys) {
            $found = @(Get-ChildItem libusb-dl/bin -Recurse -Filter $file | Where-Object { $_.Directory.Name -eq 'amd64' })
            if ($found.Count -ne 1) { throw "libusb-win32: amd64\$file not found exactly once" }
            $hash = (Get-FileHash $found[0].FullName -Algorithm SHA256).Hash
            if ($hash -ne $expected[$file]) { throw "libusb-win32: $file has the fingerprint $hash, not the expected one" }
            $sig = Get-AuthenticodeSignature $found[0].FullName
            Write-Host "$file : SHA-256 as expected; signature $($sig.Status), $($sig.SignerCertificate.Subject)"
            Copy-Item $found[0].FullName usb/
          }
          foreach ($doc in 'COPYING_LGPL.txt', 'COPYING_GPL.txt', 'AUTHORS.txt', 'README.txt') {
            $p = Get-ChildItem libusb-dl/bin -Recurse -Filter $doc | Select-Object -First 1
            if ($p) { Copy-Item $p.FullName "usb/libusb-win32-$doc" } else { Write-Host "::warning::libusb-win32: $doc not in the archive" }
          }
          # (its source, for the release: the library is LGPL and the driver GPL)
          $src = (Get-FileHash libusb-dl/libusb-win32-src-1.2.6.0.zip -Algorithm SHA256).Hash
          if ($src -eq 'F3FAF094C9B3415EDE42EEB5032FEDA2E71945F13F0CA3DA58CA10DCB439BFEE') {
            Copy-Item libusb-dl/libusb-win32-src-1.2.6.0.zip dist-usb-kaynak/
          } else {
            Write-Host "::warning::libusb-win32: the source archive's fingerprint $src is not the expected one; it is not attached"
          }
      - name: Build and gather
        run: bash paketle.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ReliosMirror-windows
          path: dist/ReliosMirror
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ReliosMirror-tek-exe
          path: dist/tek-exe
      # The source code this build was made from, next to the program (only what is in the repository: no
      # .git folder, nothing that was built).
      - name: Gather the source code
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist/kaynak | Out-Null
          git archive --format=tar -o dist/kaynak.tar HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git archive failed' }
          tar -xf dist/kaynak.tar -C dist/kaynak
          if ($LASTEXITCODE -ne 0) { throw 'tar failed' }
          Remove-Item dist/kaynak.tar
          # the virtual camera's source as it was fetched (without the changes made above): with it the
          # camera can be built again even if its repository is gone one day
          if (Test-Path softcam/.git) {
            New-Item -ItemType Directory -Force dist/kamera-kaynak | Out-Null
            git -C softcam archive --format=zip --prefix=softcam-d1acde4/ -o "$PWD/dist/kamera-kaynak/softcam-d1acde4-kaynak.zip" HEAD
            if ($LASTEXITCODE -ne 0) { throw 'git archive (softcam) failed' }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: true
        with:
          name: ReliosMirror-kaynak-kod
          path: dist/kaynak
          include-hidden-files: true
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: true
        with:
          name: ReliosMirror-sanal-kamera-kaynak
          path: dist/kamera-kaynak
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: true
        with:
          name: ReliosMirror-usb-surucu-kaynak
          path: dist-usb-kaynak
          if-no-files-found: warn
      # What this build was made with (the packages are a rolling distribution: a later build gets newer ones).
      - name: Record the build environment
        continue-on-error: true
        run: |
          mkdir -p dist/ortam
          {
            echo "Relios Mirror: bu derlemenin yapildigi ortam"
            echo "commit: $GITHUB_SHA ($GITHUB_REF_NAME)"
            echo "runner: ${ImageOS:-?} ${ImageVersion:-?}"
            echo "softcam: d1acde4617782f87a3929d7a7528fa3e524ec56b (https://github.com/tshino/softcam)"
            echo "libusb-win32: 1.2.6.0 (SourceForge), libusb0.sys 8058f2af..., libusb0.dll 4f18b5d2..."
            gcc --version | head -1
            cmake --version | head -1
            echo
            echo "MSYS2 paketleri (UCRT64):"
            pacman -Q
          } > dist/ortam/derleme-ortami.txt
          grep -E "^mingw-w64-ucrt-x86_64-(gcc|cmake|ffmpeg|SDL2|sdl2-compat|SDL2_ttf|sdl3|openssl) " dist/ortam/derleme-ortami.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: true
        with:
          name: ReliosMirror-derleme-ortami
          path: dist/ortam
          if-no-files-found: warn

  # The files of the build are kept as a DRAFT release (the repository's Releases page): only the owner of the
  # repository sees a draft until it is published, and it does not expire as the build's artifacts do.
  #  - a push to main: the draft of the version in viewer/version.h is made, or refreshed with this build
  #    (a version that is already published is left alone);
  #  - a version tag (v1.2.3): the files go to that tag's release.
  # The one job that may write to the repository. It builds nothing and runs nothing that was downloaded or
  # built: it only passes the build's files on.
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: parts
      - name: Keep the files as a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$REF" == refs/tags/v* ]]; then
            tag="$REF_NAME"
          else
            version=$(sed -n 's/^#define APP_VERSION "\([0-9][0-9.]*\)".*$/\1/p' parts/ReliosMirror-kaynak-kod/viewer/version.h | head -1)
            test -n "$version"
            tag="v$version"
          fi
          version="${tag#v}"
          mkdir -p out pack/ReliosMirror
          test -f parts/ReliosMirror-tek-exe/ReliosMirror.exe
          cp parts/ReliosMirror-tek-exe/ReliosMirror.exe out/ReliosMirror.exe
          cp -r parts/ReliosMirror-windows/. pack/ReliosMirror/
          (cd pack && zip -qr ../out/ReliosMirror-klasor.zip ReliosMirror)
          mkdir -p pack/Relios-Mirror-kaynak-kod
          cp -r parts/ReliosMirror-kaynak-kod/. pack/Relios-Mirror-kaynak-kod/
          (cd pack && zip -qr ../out/Relios-Mirror-kaynak-kod.zip Relios-Mirror-kaynak-kod)
          if [ -d parts/ReliosMirror-sanal-kamera-kaynak ]; then cp parts/ReliosMirror-sanal-kamera-kaynak/*.zip out/; fi
          if [ -d parts/ReliosMirror-usb-surucu-kaynak ]; then cp parts/ReliosMirror-usb-surucu-kaynak/*.zip out/ || true; fi
          if [ -d parts/ReliosMirror-derleme-ortami ]; then cp parts/ReliosMirror-derleme-ortami/*.txt out/; fi
          (cd out && sha256sum -- * > ../SHA256SUMS.txt && mv ../SHA256SUMS.txt . && cat SHA256SUMS.txt)
          {
            echo "Relios Mirror $version (commit ${GITHUB_SHA:0:7})"
            echo
            echo "- **ReliosMirror.exe**: program (tek dosya). Indirip calistirin."
            echo "- **ReliosMirror-klasor.zip**: ayni program, klasor halinde (butun DLL'leriyle)."
            echo "- **Relios-Mirror-kaynak-kod.zip**: bu surumun kaynak kodu (BENIOKU.txt ve GELISTIRME.txt icinde)."
            echo "- **softcam-d1acde4-kaynak.zip**: sanal kameranin kaynagi (softcam, MIT)."
            echo "- **libusb-win32-src-1.2.6.0.zip**: kablolu yansitmanin USB surucusunun kaynagi (libusb-win32; LGPL / GPL)."
            echo "- **derleme-ortami.txt**: bu surumun derlendigi arac ve kitaplik surumleri."
            echo "- **SHA256SUMS.txt**: dosyalarin SHA-256 ozetleri. Dogrulamak icin (PowerShell): \`Get-FileHash ReliosMirror.exe\`"
          } > notes.md
          state=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          echo "release $tag: $state"
          if [ "$state" = none ]; then
            gh release create "$tag" out/* --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "Relios Mirror $version" --notes-file notes.md
            echo "::notice::Draft release $tag made."
          elif [ "$state" = true ]; then
            gh release upload "$tag" out/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Relios Mirror $version" --notes-file notes.md
            echo "::notice::Draft release $tag refreshed with this build."
          elif [[ "$REF" == refs/tags/v* ]]; then
            gh release upload "$tag" out/* --repo "$GITHUB_REPOSITORY" --clobber
            echo "::notice::The files were added to the published release $tag."
          else
            echo "::notice::$tag is already published: its files are left as they are. For a new release raise the version in viewer/version.h."
          fi
